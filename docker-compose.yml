# docker-compose.yml — shared tokyo3 mesh root owned by tokyo3-ca
#
# Default CA dev/integration stack. It starts the certd-rooted shared
# backplane that sibling repos consume over stable Docker DNS aliases:
#
#   tokyo3-postgres:5432   mTLS-only Postgres
#   tokyo3-nats:4222       mTLS NATS/JetStream
#   certd:8443             certd signing API on tokyo3_idp
#
# Use `make docker-up` so external networks, CA-local shared_data, and the
# downstream cert-only tokyo3_shared_data volume are created/populated first.

services:

  # ── shared Postgres backplane ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    entrypoint: ["sh", "/shared/postgres/pg-entrypoint.sh"]
    environment:
      PG_INIT_SCRIPT: /shared/postgres/db-init.sh
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_SSL_CERT: /shared/certs/postgres.crt
      POSTGRES_SSL_KEY: /shared/certs/postgres.key
      POSTGRES_SSL_CA: /shared/certs/certd-x509-ca.crt
    volumes:
      - shared_data:/shared:ro
      - mesh_db_data:/var/lib/postgresql/data
    networks:
      tokyo3_backplane:
        aliases:
          - tokyo3-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── shared NATS/JetStream backplane ─────────────────────────────────────────
  nats:
    image: nats:2-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "--tls"
      - "--tlscert=/shared/certs/nats.crt"
      - "--tlskey=/shared/certs/nats.key"
      - "--tlscacert=/shared/certs/certd-x509-ca.crt"
      - "--tlsverify"
    volumes:
      - shared_data:/shared:ro
      - mesh_nats_data:/data
    networks:
      tokyo3_backplane:
        aliases:
          - tokyo3-nats
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  # ── shared NATS CLI/provisioner ─────────────────────────────────────────────
  natsbox:
    image: natsio/nats-box:${NATSBOX_VERSION:-0.19.5}
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: tls://tokyo3-nats:4222
    volumes:
      - shared_data:/shared:ro
    networks:
      - tokyo3_backplane
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        nats context save default \
          --server tls://tokyo3-nats:4222 \
          --tlscert /shared/certs/natsbox.crt \
          --tlskey /shared/certs/natsbox.key \
          --tlsca /shared/certs/certd-x509-ca.crt \
          --select > /dev/null

        nats stream info ca_audit > /dev/null 2>&1 || \
          nats stream add ca_audit \
            --subjects 'ca.audit.events' \
            --retention limits \
            --storage file \
            --max-age 9600h \
            --deny-delete \
            --deny-purge \
            --defaults

        nats stream info auth_audit > /dev/null 2>&1 || \
          nats stream add auth_audit \
            --subjects 'auth.audit.events' \
            --retention limits \
            --storage file \
            --max-age 9600h \
            --deny-delete \
            --deny-purge \
            --defaults

        nats stream info app_log > /dev/null 2>&1 || \
          nats stream add app_log \
            --subjects 'app_log.>' \
            --retention limits \
            --storage file \
            --max-age 168h \
            --max-bytes 268435456 \
            --discard old \
            --defaults

        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "nats stream info ca_audit > /dev/null 2>&1 && nats stream info auth_audit > /dev/null 2>&1 && nats stream info app_log > /dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  # ── certd: CA service on the shared mesh ────────────────────────────────────
  certd:
    build:
      context: .
      target: server
      args:
        VERSION: ${VERSION:-dev-docker}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      natsbox:
        condition: service_healthy
    volumes:
      - shared_data:/shared:ro
    networks:
      tokyo3_backplane: {}
      tokyo3_idp:
        aliases:
          - certd
          - certd.localhost
    environment:
      CERTD_ADDR: ":8443"
      CERTD_API_CERT: /shared/certs/certd.crt
      CERTD_API_KEY: /shared/certs/certd.key
      CERTD_API_CLIENT_CA: /shared/certs/certd-x509-ca.crt

      CERTD_CA_KEY: file:/shared/certs/certd-signing.key
      CERTD_CA_X509_CERT_FILE: /shared/certs/certd-x509-int.crt
      CERTD_CA_SEALED_KEY_FILE: /shared/certs/certd-x509-int.key.sealed
      CERTD_CA_SEAL_KEY: file:/shared/certs/seal.key
      CERTD_CA_ROOT_CERT_FILE: /shared/certs/certd-x509-ca.crt

      CERTD_DATABASE_URL: "postgres://certd@tokyo3-postgres:5432/certd?sslmode=verify-full&sslcert=/shared/certs/certd-db.crt&sslkey=/shared/certs/certd-db.key&sslrootcert=/shared/certs/certd-x509-ca.crt"
      CERTD_NATS_URL: tls://tokyo3-nats:4222
      CERTD_NATS_CERT: /shared/certs/certd-nats.crt
      CERTD_NATS_KEY: /shared/certs/certd-nats.key
      CERTD_NATS_CA: /shared/certs/certd-x509-ca.crt

      CERTD_ROLES_FILE: /shared/policy/roles.json
      CERTD_MTLS_PRINCIPALS_FILE: /shared/policy/principals.json

      # Basic auth keeps the portal usable before auth OIDC is layered on.
      CERTD_PORTAL_USERNAME: ${CERTD_PORTAL_USERNAME:-admin}
      CERTD_PORTAL_PASSWORD: ${CERTD_PORTAL_PASSWORD:-certd-dev}
      CERTD_PORTAL_REALM: certd portal

      # Optional auth-backed portal OIDC. Set all five values to enable.
      CERTD_PORTAL_OIDC_ISSUER: ${CERTD_PORTAL_OIDC_ISSUER:-}
      CERTD_PORTAL_OIDC_CLIENT_ID: ${CERTD_PORTAL_OIDC_CLIENT_ID:-}
      CERTD_PORTAL_OIDC_CLIENT_SECRET: ${CERTD_PORTAL_OIDC_CLIENT_SECRET:-}
      CERTD_PORTAL_OIDC_REDIRECT_URL: ${CERTD_PORTAL_OIDC_REDIRECT_URL:-}
      CERTD_PORTAL_SESSION_KEY: ${CERTD_PORTAL_SESSION_KEY:-}
      CERTD_PORTAL_ADMIN_GROUP: ${CERTD_PORTAL_ADMIN_GROUP:-ca-portal-admin}

      # Optional bearer-token verifier for API callers.
      CERTD_OIDC_ISSUER: ${CERTD_OIDC_ISSUER:-}
      CERTD_OIDC_AUDIENCE: ${CERTD_OIDC_AUDIENCE:-}

      # Lets certd trust auth.localhost when portal OIDC points at auth's
      # mkcert-backed HTTPS issuer.
      SSL_CERT_FILE: ${CERTD_SSL_CERT_FILE:-/shared/certs/traefik-ca.crt}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── traefik: certd host-facing HTTPS edge ───────────────────────────────────
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.3}
    depends_on:
      certd:
        condition: service_healthy
    command:
      - "--entrypoints.websecure.address=:8443"
      - "--entrypoints.ping.address=:8082"
      - "--ping=true"
      - "--ping.entryPoint=ping"
      - "--providers.file.filename=/shared/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
    volumes:
      - shared_data:/shared:ro
    networks:
      tokyo3_idp: {}
    ports:
      - "${CERTD_TRAEFIK_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # ── demo cert-agentd: exercises certd renewal against the mesh ──────────────
  cert-agentd-init:
    image: alpine:3.21
    depends_on:
      certd:
        condition: service_healthy
    volumes:
      - shared_data:/shared:ro
      - agent_state:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /state/svid.pem ]; then
          echo "cert-agentd-init: /state already populated, skipping"
          exit 0
        fi
        cp /shared/certs/cert-agentd.crt /state/svid.pem
        cp /shared/certs/cert-agentd.key /state/svid.key
        cp /shared/certs/certd-x509-ca.crt /state/svid_bundle.pem
        chmod 644 /state/svid.pem /state/svid_bundle.pem
        chmod 600 /state/svid.key
        echo "cert-agentd-init: seeded bootstrap material into agent_state"
    restart: "no"

  cert-agentd:
    build:
      context: .
      target: agent
      args:
        VERSION: ${VERSION:-dev-docker}
    depends_on:
      cert-agentd-init:
        condition: service_completed_successfully
    volumes:
      - agent_state:/certs:rw
      - shared_data:/shared:ro
    networks:
      tokyo3_backplane: {}
      tokyo3_idp: {}
    environment:
      CERT_AGENTD_CERTD_URL: https://certd:8443
      CERT_AGENTD_WORKLOAD_CERT: /certs/svid.pem
      CERT_AGENTD_WORKLOAD_KEY: /certs/svid.key
      CERT_AGENTD_WORKLOAD_CA: /shared/certs/certd-x509-ca.crt
      CERT_AGENTD_SPIFFE_URI: spiffe://tokyo3/authd/agent
      CERT_AGENTD_TTL_SECONDS: "120"
      CERT_AGENTD_GROUPS: authd
      CERT_AGENTD_WORKLOADS_FILE: /shared/agent/workloads.yaml
      CERT_AGENTD_TRUST_BUNDLE_PATH: /certs/svid_bundle.pem
      CERT_AGENTD_NATS_URL: tls://tokyo3-nats:4222
      CERT_AGENTD_NATS_CERT: /certs/svid.pem
      CERT_AGENTD_NATS_KEY: /certs/svid.key
      CERT_AGENTD_NATS_CA: /certs/svid_bundle.pem
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /certs/svid.pem) )) -lt 150"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  shared_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-ca}_shared_data
  agent_state:
  mesh_db_data:
  mesh_nats_data:

networks:
  tokyo3_backplane:
    external: true
    name: ${TOKYO3_BACKPLANE_NETWORK:-tokyo3_backplane}
  tokyo3_idp:
    external: true
    name: ${TOKYO3_IDP_NETWORK:-tokyo3_idp}
