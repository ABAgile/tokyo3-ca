# pg_hba.conf — ca dev rig, mTLS enabled BY DEFAULT (docker-compose.yml).
#
# Local socket: trusted, so the docker-entrypoint-initdb.d bootstrap scripts
# (db-init.sh) can create roles before any cert material is in play.
local   all   all             trust
# TLS connections: authenticate via client certificate. The cert CN must match
# the connecting role (<service>_app / <service>_admin), and the cert must
# chain to ssl_ca_file (certd-x509-ca.crt) — i.e. it must have been issued by
# certd.
hostssl all   all   all       cert
# Plain TCP (no TLS): rejected outright. There is no password path.
host    all   all   all       reject
