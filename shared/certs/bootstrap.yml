ssh_ca:
  key: certd-signing.key
  public_key: certd-signing.key.pub
  comment: certd-user-ca

root:
  key: root.key
  cert: certd-x509-ca.crt
  cn: tokyo3-ca root
  key_type: ed25519

seal:
  key: seal.key

intermediate:
  cert: certd-x509-int.crt
  sealed_key: certd-x509-int.key.sealed
  cn: tokyo3-ca intermediate
  key_type: ed25519
  ttl: 2160h

servers:
  - name: certd
    dns: [certd, localhost]
    ips: [127.0.0.1]
  - name: nats
    dns: [nats, tokyo3-nats, localhost]
    ips: [127.0.0.1]
  - name: postgres
    dns: [postgres, tokyo3-postgres, localhost]
    ips: [127.0.0.1]

workloads:
  - name: certd-nats
    spiffe_uri: spiffe://tokyo3/certd/nats
  - name: natsbox
    spiffe_uri: spiffe://tokyo3/certd/natsbox
  - name: certd-db
    spiffe_uri: spiffe://tokyo3/certd/db
    cn: certd
  - name: cert-agentd
    spiffe_uri: spiffe://tokyo3/authd/agent
